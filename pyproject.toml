[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synpo-microscopy"
version = "0.8.0"
description = "Desktop workflow for paired-channel 3D microscopy data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.2.4,<7",
    "tifffile>=2024.5",
    "scipy>=1.13,<1.18",
    "scikit-image>=0.24,<1",
    "zarr>=2.18,<3",
    "numcodecs>=0.12,<0.16",
    "psutil>=6,<8",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
    "Pillow>=10,<13",
    "scikit-learn>=1.3,<2",
    "umap-learn>=0.5.7,<0.6",
]

[project.optional-dependencies]
advanced-clustering = [
    "pccdr==1.0.3",
]

[project.scripts]
synpo = "synpo.app:main"
synpo-inspect = "synpo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synpo = ["assets/*.png", "assets/*.ico", "assets/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
